<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ Zaalvoetbal</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#6b7785;--line:#e2e7ec;--green:#1d9a63;--red:#d9534f;--orange:#e99a24;--blue:#2f6fed;--shadow:0 4px 18px rgba(20,35,50,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit}header{background:#17212b;color:#fff;padding:22px 18px 18px}header h1{margin:0;font-size:24px}header .team{margin-top:5px;font-size:14px;color:#c8d1da}.connection{margin-top:12px;font-size:12px;color:#ffd166}.connection.ok{color:#7be0ad}.wrap{max-width:1050px;margin:0 auto;padding:16px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab,.filter button,.refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--text)}.tab.active,.filter button.active{background:#17212b;color:#fff;border-color:#17212b}.refresh{margin-left:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.filter{display:flex;gap:6px;flex-wrap:wrap}.section-title{font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 8px}.cards{display:grid;gap:12px}.match-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.match-top{display:flex;justify-content:space-between;gap:12px;padding:15px 16px 10px}.date{font-size:12px;color:var(--muted);text-transform:capitalize}.versus{font-weight:700;margin-top:4px}.result{font-size:13px;margin-top:5px;color:var(--muted)}.status{font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px;height:max-content}.status.green{background:#e4f6ed;color:#147448}.status.red{background:#fde9e8;color:#a92e2a}.status.orange{background:#fff1dc;color:#9a610d}.players{display:flex;flex-wrap:wrap;gap:7px;padding:8px 16px 15px}.pill{border:1px solid var(--line);background:#f7f9fb;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px}.pill.yes{background:#e5f7ee;border-color:#a8dfc4;color:#116b43}.pill.no{background:#fdeaea;border-color:#efb7b5;color:#a52e2a;text-decoration:line-through}.pill.unset{color:#596674}.actions{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px}.action-btn{border:0;background:#edf2f7;border-radius:9px;padding:8px 11px;cursor:pointer}.empty{background:#fff;border:1px dashed #cfd7df;border-radius:14px;padding:25px;text-align:center;color:var(--muted)}.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.panel h3{margin:0 0 12px;font-size:16px}.scorer{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.scorer:last-child{border-bottom:0}.count{font-weight:800}.chart-wrap{overflow:auto}.chart{width:100%;min-width:460px;height:230px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.open{display:flex}.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px}.modal h2{margin:0 0 4px}.modal-sub{color:var(--muted);font-size:13px;margin-bottom:12px}.goal-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.goal-controls{display:flex;align-items:center;gap:9px}.goal-controls button{width:32px;height:32px;border:0;border-radius:8px;background:#edf2f7;cursor:pointer;font-size:18px}.goal-num{min-width:22px;text-align:center;font-weight:800}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.modal-actions button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer}.cancel{background:#edf2f7}.save{background:#17212b;color:#fff}@media(max-width:700px){.side-grid{grid-template-columns:1fr}.match-top{align-items:flex-start}.refresh{margin-left:0}}
</style>
</head>
<body>
<header>
<h1>⚽ Zaalvoetbal</h1>
<div class="team">Theater (het)/Drukkerij Krijgsman 35+ 1</div>
<div id="connection" class="connection">Verbinden met teamdatabase…</div>
</header>
<main class="wrap">
<div class="toolbar"><div class="tabs"><button id="tabAll" class="tab active">Alle wedstrijden</button><button id="tabAction" class="tab">Actie nodig</button></div><button id="refresh" class="refresh">↻ Vernieuwen</button></div>
<div class="toolbar"><div class="filter"><button data-filter="all" class="active">Heel seizoen</button><button data-filter="upcoming">Komende wedstrijden</button><button data-filter="played">Gespeeld</button></div></div>
<div id="matches" class="cards"></div>
<div class="side-grid"><section class="panel"><h3>Seizoensstatus</h3><div id="seasonStatus"></div></section><section class="panel"><h3>Topscorers</h3><div id="scorers"></div></section></div>
<section class="panel" style="margin-top:14px"><h3>Doelpuntenverloop</h3><div id="chart" class="chart-wrap"></div></section>
</main>
<div id="modalBack" class="modal-back"><div class="modal"><h2>Doelpunten invoeren</h2><div id="modalSub" class="modal-sub"></div><div id="goalRows"></div><div class="modal-actions"><button id="cancelGoals" class="cancel">Annuleren</button><button id="saveGoals" class="save">Opslaan</button></div></div></div>
<script>
"use strict";
const SUPABASE_URL="https://ksamehchmhctipbldfiw.supabase.co";
const SUPABASE_KEY="sb_publishable_YiGFTJyNuHXGSkIqmxZm-A_vD0036jw";
const API=SUPABASE_URL+"/rest/v1";
const headers={apikey:SUPABASE_KEY,"Content-Type":"application/json"};
let players=[];
let fixtures=[];
let data={matches:[]};
let currentTab="all";
let currentFilter="all";
let selectedMatch=null;
let refreshing=false;
const connectionEl=document.getElementById("connection");
const matchesEl=document.getElementById("matches");
const seasonStatusEl=document.getElementById("seasonStatus");
const scorersEl=document.getElementById("scorers");
const chartEl=document.getElementById("chart");
const modalBack=document.getElementById("modalBack");
const goalRows=document.getElementById("goalRows");
const modalSub=document.getElementById("modalSub");

function setConnection(ok,text){connectionEl.textContent=text;connectionEl.className="connection"+(ok?" ok":"")}

async function api(path,options={}){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),10000);
 try{
  const response=await fetch(API+path,{...options,headers:{...headers,...(options.headers||{})},signal:controller.signal});
  const text=await response.text();
  let body=null;
  if(text){try{body=JSON.parse(text)}catch(e){body=text}}
  if(!response.ok){let message=body&&body.message?body.message:String(body||response.statusText);throw new Error(response.status+" "+message)}
  return body;
 }catch(error){if(error.name==="AbortError")throw new Error("Supabase reageert niet binnen 10 seconden");throw error}
 finally{clearTimeout(timer)}
}

function fmtDate(value){
 const d=new Date(value+"T12:00:00");
 return {day:d.toLocaleDateString("nl-NL",{day:"2-digit"}),mon:d.toLocaleDateString("nl-NL",{month:"short"}),full:d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
}
function fmtTime(value){return value?String(value).slice(0,5):""}
function todayString(){const now=new Date();return now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")}
function matchIsPlayed(match){return match.goals_for!==null&&match.goals_for!==undefined&&match.goals_against!==null&&match.goals_against!==undefined}
function attendanceSummary(match){let present=0,absent=0;for(const player of players){const status=match.attendance[player.id];if(status==="yes")present++;if(status==="no")absent++}return{present,absent}}
function statusForMatch(match){const s=attendanceSummary(match);if(matchIsPlayed(match))return{cls:"green",text:"Gespeeld"};if(s.present>0)return{cls:"green",text:s.present+" aanwezig"};if(s.absent>0)return{cls:"orange",text:s.absent+" afwezig"};return{cls:"red",text:"Actie nodig"}}
function buildMatchText(fixture){const team="Theater (het)/Drukkerij Krijgsman 35+ 1";return fixture.home?team+" <strong>— "+fixture.opponent+"</strong>":"<strong>"+fixture.opponent+"</strong> — "+team}

function render(){renderMatches();renderSide()}
function renderMatches(){
 const today=todayString();
 const visible=[];
 for(let i=0;i<fixtures.length;i++){
  const fixture=fixtures[i],match=data.matches[i],played=matchIsPlayed(fixture),upcoming=fixture.match_date>=today&&!played,s=attendanceSummary(match),action=!played&&s.present===0&&s.absent===0;
  if(currentFilter==="upcoming"&&!upcoming)continue;
  if(currentFilter==="played"&&!played)continue;
  if(currentTab==="action"&&!action)continue;
  visible.push({fixture,match,index:i});
 }
 if(!visible.length){matchesEl.innerHTML='<div class="empty">Geen wedstrijden gevonden voor deze selectie.</div>';return}
 matchesEl.innerHTML="";
 for(const item of visible){
  const f=item.fixture,m=item.match,index=item.index,date=fmtDate(f.match_date),status=statusForMatch(m);
  const result=matchIsPlayed(f)?'<div class="result">Uitslag: <strong>'+f.goals_for+" - "+f.goals_against+"</strong></div>":"";
  const card=document.createElement("article");card.className="match-card";
  let playersHtml="";
  for(const player of players){const state=m.attendance[player.id]||"unset";const label=state==="yes"?"✓ "+player.name:state==="no"?"✕ "+player.name:player.name;playersHtml+='<button class="pill '+state+'" data-player="'+player.id+'">'+label+'</button>'}
  card.innerHTML='<div class="match-top"><div><div class="date">'+date.full+(f.match_time?" · "+fmtTime(f.match_time):"")+'</div><div class="versus">'+buildMatchText(f)+'</div>'+result+'</div><div class="status '+status.cls+'">'+status.text+'</div></div><div class="players">'+playersHtml+'</div><div class="actions"><button class="action-btn goals-btn">⚽ Doelpunten</button></div>';
  card.querySelectorAll(".pill").forEach(button=>button.addEventListener("click",()=>toggleAttendance(index,button.dataset.player)));
  card.querySelector(".goals-btn").addEventListener("click",()=>openGoals(index));
  matchesEl.appendChild(card);
 }
}

async function toggleAttendance(index,playerId){
 const fixture=fixtures[index],match=data.matches[index],current=match.attendance[playerId]||"unset",next=current==="unset"?"yes":current==="yes"?"no":"unset";
 try{
  if(next==="unset"){
   await api("/attendance?match_id=eq."+encodeURIComponent(fixture.id)+"&player_id=eq."+encodeURIComponent(playerId),{method:"DELETE"});
   delete match.attendance[playerId];
  }else{
   await api("/attendance?on_conflict=match_id,player_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({match_id:fixture.id,player_id:playerId,status:next==="yes"?"present":"absent"})});
   match.attendance[playerId]=next;
  }
  render();
 }catch(error){console.error(error);alert("Opslaan van aanwezigheid mislukt. "+error.message)}
}

function openGoals(index){
 selectedMatch=index;const fixture=fixtures[index],match=data.matches[index];
 modalSub.textContent=fmtDate(fixture.match_date).full+" · "+(fixture.home?"Theater (het)":fixture.opponent)+" - "+(fixture.home?fixture.opponent:"Theater (het)");
 goalRows.innerHTML="";
 for(const player of players){
  const row=document.createElement("div");row.className="goal-row";const value=Number(match.goals[player.id]||0);
  row.innerHTML='<span>'+player.name+'</span><div class="goal-controls"><button class="minus">−</button><span class="goal-num">'+value+'</span><button class="plus">+</button></div>';
  row.querySelector(".minus").addEventListener("click",()=>{const el=row.querySelector(".goal-num");el.textContent=Math.max(0,Number(el.textContent)-1)});
  row.querySelector(".plus").addEventListener("click",()=>{const el=row.querySelector(".goal-num");el.textContent=Number(el.textContent)+1});
  goalRows.appendChild(row);
 }
 modalBack.classList.add("open");
}

document.getElementById("cancelGoals").addEventListener("click",()=>{modalBack.classList.remove("open");selectedMatch=null});
document.getElementById("saveGoals").addEventListener("click",async()=>{
 if(selectedMatch===null)return;
 const index=selectedMatch,fixture=fixtures[index],match=data.matches[index];
 try{
  const rows=[...goalRows.querySelectorAll(".goal-row")];
  for(let i=0;i<players.length;i++){
   const count=Number(rows[i].querySelector(".goal-num").textContent);
   await api("/goals?on_conflict=match_id,player_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({match_id:fixture.id,player_id:players[i].id,goal_count:count})});
   match.goals[players[i].id]=count;
  }
  modalBack.classList.remove("open");selectedMatch=null;render();
 }catch(error){console.error(error);alert("Doelpunten opslaan mislukt. "+error.message)}
});
modalBack.addEventListener("click",event=>{if(event.target===modalBack){modalBack.classList.remove("open");selectedMatch=null}});

function renderSide(){
 let totalPresent=0,totalAbsent=0,played=0,upcoming=0;
 for(const match of data.matches){const s=attendanceSummary(match);totalPresent+=s.present;totalAbsent+=s.absent;if(matchIsPlayed(match))played++;else upcoming++}
 seasonStatusEl.innerHTML='<div class="scorer"><span>Wedstrijden gespeeld</span><span class="count">'+played+'</span></div><div class="scorer"><span>Komende wedstrijden</span><span class="count">'+upcoming+'</span></div><div class="scorer"><span>Geregistreerd aanwezig</span><span class="count">'+totalPresent+'</span></div><div class="scorer"><span>Geregistreerd afwezig</span><span class="count">'+totalAbsent+'</span></div>';
 const totals={};for(const player of players)totals[player.id]=0;
 for(const match of data.matches)for(const player of players)totals[player.id]+=Number(match.goals[player.id]||0);
 const ranked=players.map(player=>({player,goals:totals[player.id]||0})).filter(x=>x.goals>0).sort((a,b)=>b.goals-a.goals||a.player.sort_order-b.player.sort_order);
 scorersEl.innerHTML=ranked.length?ranked.map(x=>'<div class="scorer"><span>'+x.player.name+'</span><span class="count">'+x.goals+'</span></div>').join(""):'<div style="color:var(--muted)">Nog geen doelpunten geregistreerd.</div>';
 drawChart(ranked.slice(0,5));
}
function drawChart(top){
 if(!top.length||!fixtures.length){chartEl.innerHTML='<div style="color:var(--muted)">Nog onvoldoende gegevens voor de grafiek.</div>';return}
 const width=760,height=230,left=38,right=15,topPad=15,bottom=30,plotWidth=width-left-right,plotHeight=height-topPad-bottom;
 const totals={};let max=1;for(const item of top)totals[item.player.id]=0;
 for(let i=0;i<fixtures.length;i++)for(const item of top){totals[item.player.id]+=Number(data.matches[i].goals[item.player.id]||0);if(totals[item.player.id]>max)max=totals[item.player.id]}
 let svg='<svg class="chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Cumulatieve doelpunten">';
 svg+='<line x1="'+left+'" y1="'+topPad+'" x2="'+left+'" y2="'+(height-bottom)+'" stroke="#ccd4dc"/><line x1="'+left+'" y1="'+(height-bottom)+'" x2="'+(width-right)+'" y2="'+(height-bottom)+'" stroke="#ccd4dc"/>';
 for(const item of top){let cumulative=0,points=[];for(let i=0;i<fixtures.length;i++){cumulative+=Number(data.matches[i].goals[item.player.id]||0);const x=left+plotWidth*i/Math.max(1,fixtures.length-1),y=topPad+plotHeight-cumulative/max*plotHeight;points.push(x.toFixed(1)+","+y.toFixed(1))}svg+='<polyline fill="none" stroke="#2f6fed" stroke-width="2" points="'+points.join(" ")+'"/>'}
 svg+='<text x="'+(left+5)+'" y="14" font-size="10" fill="#6b7785">doelpunten</text></svg>';chartEl.innerHTML=svg;
}

async function loadAll(){
 if(refreshing)return;refreshing=true;setConnection(false,"Gegevens ophalen…");
 try{
  const [playerRows,matchRows,attendanceRows,goalRowsFromDb]=await Promise.all([
   api("/players?select=id,name,is_fixed,sort_order&order=sort_order"),
   api("/matches?select=id,match_date,opponent,home,match_time,goals_for,goals_against&order=match_date"),
   api("/attendance?select=match_id,player_id,status"),
   api("/goals?select=match_id,player_id,goal_count")
  ]);
  players=(playerRows||[]).map(row=>({id:row.id,name:row.name,is_fixed:row.is_fixed,sort_order:row.sort_order}));
  fixtures=(matchRows||[]).map(row=>({id:row.id,match_date:row.match_date,opponent:row.opponent,home:row.home,match_time:row.match_time,goals_for:row.goals_for,goals_against:row.goals_against}));
  data.matches=fixtures.map(()=>({attendance:{},goals:{}}));
  const indexByMatchId={};fixtures.forEach((fixture,index)=>indexByMatchId[fixture.id]=index);
  for(const row of attendanceRows||[]){const index=indexByMatchId[row.match_id];if(index!==undefined)data.matches[index].attendance[row.player_id]=row.status==="present"?"yes":"no"}
  for(const row of goalRowsFromDb||[]){const index=indexByMatchId[row.match_id];if(index!==undefined)data.matches[index].goals[row.player_id]=Number(row.goal_count||0)}
  setConnection(true,"● Verbonden met teamdatabase");render();
 }catch(error){console.error("Supabase laden mislukt:",error);setConnection(false,"● Verbinding mislukt: "+error.message);matchesEl.innerHTML='<div class="empty">De teamdatabase kon niet worden geladen.<br><br><strong>'+error.message+'</strong></div>'}
 finally{refreshing=false}
}

document.getElementById("tabAll").addEventListener("click",()=>{currentTab="all";document.getElementById("tabAll").classList.add("active");document.getElementById("tabAction").classList.remove("active");renderMatches()});
document.getElementById("tabAction").addEventListener("click",()=>{currentTab="action";document.getElementById("tabAction").classList.add("active");document.getElementById("tabAll").classList.remove("active");renderMatches()});
document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{currentFilter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b===button));renderMatches()}));
document.getElementById("refresh").addEventListener("click",loadAll);
loadAll();setInterval(loadAll,5000);
</script>
</body>
</html>
